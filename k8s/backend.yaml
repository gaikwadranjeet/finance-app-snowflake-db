apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend-deployment
  labels:
    app: hotel-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-backend
  template:
    metadata:
      labels:
        app: hotel-backend
    spec:
      containers:
      - name: hotel-backend
        image: hotel-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef:
            name: snowflake-secret
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend-service
spec:
  type: NodePort
  selector:
    app: hotel-backend
  ports:
  - port: 5001
    targetPort: 5001
    nodePort: 30001

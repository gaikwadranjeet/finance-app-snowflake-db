apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-frontend-deployment
  labels:
    app: hotel-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotel-frontend
  template:
    metadata:
      labels:
        app: hotel-frontend
    spec:
      containers:
      - name: hotel-frontend
        image: hotel-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-frontend-service
spec:
  type: NodePort
  selector:
    app: hotel-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

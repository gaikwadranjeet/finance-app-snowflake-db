version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel-finance-backend
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hotel-finance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
